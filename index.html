<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>排球战术板 Pro</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      padding-left: 8px;
      padding-right: 8px;
    }

    /* 2-Row Top Toolbar Container */
    #top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 100;
      margin-bottom: 4px;
    }

    /* Row 1: Move + Draw with expanding sub-pill */
    .toolbar-row-primary {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .tool-group {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 4px;
      background: #1e293b;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .tool-group > button {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }

    .tool-group > button.active {
      background: #2563eb;
      color: #ffffff;
    }

    .draw-sub-pill {
      display: flex;
      gap: 2px;
      padding-left: 4px;
      border-left: 1px solid #475569;
    }

    .draw-sub-pill button {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 5px 7px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .draw-sub-pill button.active {
      background: #3b82f6;
      color: #ffffff;
    }

    /* Row 2: Undo & Erase on Left, Reset on Right */
    .toolbar-row-secondary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      width: 34px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .icon-btn:active {
      background: #334155;
    }

    .reset-btn {
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      font-weight: 700;
      font-size: 11px;
      padding: 5px 12px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reset-btn:active {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
    }

    /* Court Board */
    #board-container {
      position: relative;
      width: min(92vw, 360px);
      height: min(184vw, 680px, 75vh);
      background-color: #d4a373;
      border: 3.5px solid #ffffff;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      margin: auto 0;
    }

    .court-line {
      position: absolute;
      background: #ffffff;
      pointer-events: none;
    }

    #net {
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: #020617;
      transform: translateY(-50%);
      z-index: 2;
    }

    #net::before, #net::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: #cbd5e1;
      border-radius: 50%;
      top: -3px;
    }
    #net::before { left: -3px; }
    #net::after { right: -3px; }

    .attack-line-top {
      top: 33.33%;
      left: 0;
      width: 100%;
      height: 2px;
    }

    .attack-line-bottom {
      top: 66.66%;
      left: 0;
      width: 100%;
      height: 2px;
    }

    /* Inside-Court Stance & Rotation Controls */
    .on-court-strip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #475569;
      padding: 2.5px;
      border-radius: 6px;
      z-index: 30;
      backdrop-filter: blur(4px);
    }

    .on-court-strip button {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 4px 6px;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }

    .on-court-strip button.active {
      color: #ffffff;
    }

    #away-stance-pill button.active {
      background: #dc2626;
    }

    #home-stance-pill button.active {
      background: #2563eb;
    }

    .blk-subgroup {
      display: flex;
      gap: 2px;
      padding-left: 2px;
      border-left: 1px solid #475569;
    }

    .on-court-rotate {
      position: absolute;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.88);
      color: #f1f5f9;
      padding: 4px 7px;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
      z-index: 30;
      backdrop-filter: blur(4px);
    }

    .on-court-rotate:active {
      background: #334155;
    }

    #away-stance-pill { top: 5px; left: 5px; }
    #away-rotate-btn { top: 5px; right: 5px; }
    #home-stance-pill { bottom: 5px; left: 5px; }
    #home-rotate-btn { bottom: 5px; right: 5px; }

    #draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* Players */
    .player {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13.5px;
      color: #ffffff;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
      border: 2px solid #ffffff;
      z-index: 10;
      transform: translate(-50%, -50%);
      letter-spacing: -0.5px;
      transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1), left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .player::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
    }

    .player.dragging {
      transition: none;
    }

    .away { background: #dc2626; }
    .home { background: #2563eb; }

    .away.setter { 
      background: #f87171; 
      color: #ffffff;
    }
    .home.setter { 
      background: #60a5fa; 
      color: #ffffff;
    }

    .player:active {
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* Volleyball */
    #volleyball {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: conic-gradient(
        #ffffff 0deg 60deg, 
        #facc15 60deg 120deg, 
        #2563eb 120deg 180deg, 
        #ffffff 180deg 240deg, 
        #facc15 240deg 300deg, 
        #2563eb 300deg 360deg
      );
      border: 2px solid #0f172a;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.65);
      z-index: 15;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      transition: top 0.35s ease, left 0.35s ease;
    }

    #volleyball.dragging {
      transition: none;
    }

    #volleyball::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
    }

    #volleyball:active {
      transform: translate(-50%, -50%) scale(1.2);
    }
  </style>
</head>
<body>

  <!-- 2-Row Top Toolbar -->
  <div id="top-bar">
    <!-- Row 1: Move & Draw (with expandable line pill) -->
    <div class="toolbar-row-primary">
      <div class="tool-group">
        <button id="mode-move" class="active" onclick="setInteractionMode('move')">✋ 移动</button>
        <button id="mode-draw-btn" onclick="activateDrawMode()">✏️ 画笔</button>
        <div id="draw-sub-pill" class="draw-sub-pill" style="display: none;">
          <button id="draw-style-free" class="active" onclick="setDrawStyle('free')">自由</button>
          <button id="draw-style-solid" onclick="setDrawStyle('solid')">实线</button>
          <button id="draw-style-dash" onclick="setDrawStyle('dash')">虚线</button>
        </div>
      </div>
    </div>

    <!-- Row 2: Undo/Erase Left, Reset Right -->
    <div class="toolbar-row-secondary">
      <div class="action-left">
        <button class="icon-btn" onclick="undoLine()" title="撤销">↩</button>
        <button class="icon-btn" onclick="clearCanvas()" title="清屏">🗑️</button>
      </div>
      <button class="reset-btn" onclick="resetPositions()">重置</button>
    </div>
  </div>

  <!-- Court Board -->
  <div id="board-container">
    <div id="net" class="court-line"></div>
    <div class="attack-line-top court-line"></div>
    <div class="attack-line-bottom court-line"></div>

    <!-- Away Controls: Order 接, 攻, 防 + [左, 中, 右] -->
    <div id="away-stance-pill" class="on-court-strip">
      <button id="away-btn-receive" onclick="setTeamStance('away', 'receive')">接</button>
      <button id="away-btn-offense" onclick="setTeamStance('away', 'offense')">攻</button>
      <button id="away-btn-defense" class="active" onclick="setTeamStance('away', 'defense')">防</button>
      <div id="away-blk-wrap" class="blk-subgroup">
        <button id="away-blk-left" onclick="setBlockSide('away', 'left')">左</button>
        <button id="away-blk-mid" class="active" onclick="setBlockSide('away', 'mid')">中</button>
        <button id="away-blk-right" onclick="setBlockSide('away', 'right')">右</button>
      </div>
    </div>
    <button id="away-rotate-btn" class="on-court-rotate" onclick="rotateTeam('away')">🔄 轮转</button>

    <!-- Home Controls: Order 接, 攻, 防 + [左, 中, 右] -->
    <div id="home-stance-pill" class="on-court-strip">
      <button id="home-btn-receive" class="active" onclick="setTeamStance('home', 'receive')">接</button>
      <button id="home-btn-offense" onclick="setTeamStance('home', 'offense')">攻</button>
      <button id="home-btn-defense" onclick="setTeamStance('home', 'defense')">防</button>
      <div id="home-blk-wrap" class="blk-subgroup" style="display: none;">
        <button id="home-blk-left" onclick="setBlockSide('home', 'left')">左</button>
        <button id="home-blk-mid" class="active" onclick="setBlockSide('home', 'mid')">中</button>
        <button id="home-blk-right" onclick="setBlockSide('home', 'right')">右</button>
      </div>
    </div>
    <button id="home-rotate-btn" class="on-court-rotate" onclick="rotateTeam('home')">🔄 轮转</button>

    <canvas id="draw-layer"></canvas>
    <div id="volleyball"></div>
    <div id="players-layer"></div>
  </div>

  <script>
    const container = document.getElementById('board-container');
    const canvas = document.getElementById('draw-layer');
    const ctx = canvas.getContext('2d');
    const playersLayer = document.getElementById('players-layer');
    const ball = document.getElementById('volleyball');

    let currentMode = 'move';
    let lineStyle = 'free';
    let isDrawing = false;
    let strokes = [];
    let currentStroke = [];

    // Option A Boot: Away = Defense/Serve, Home = Receive
    let teamStances = {
      away: 'defense',
      home: 'receive'
    };

    let teamBlockSide = {
      away: 'mid',
      home: 'mid'
    };

    let teamRotation = {
      away: 0,
      home: 0
    };

    function getStrokeColor(style) {
      if (style === 'dash') return '#ffffff';
      if (style === 'free') return '#000000';
      return '#ef4444';
    }

    const defenseFormations = {
      away: {
        left: [
          { x: 0.20, y: 0.44 },
          { x: 0.33, y: 0.44 },
          { x: 0.46, y: 0.44 },
          { x: 0.90, y: 0.26 },
          { x: 0.10, y: 0.30 }
        ],
        mid: [
          { x: 0.35, y: 0.44 },
          { x: 0.50, y: 0.44 },
          { x: 0.65, y: 0.44 },
          { x: 0.80, y: 0.18 },
          { x: 0.20, y: 0.18 }
        ],
        right: [
          { x: 0.54, y: 0.44 },
          { x: 0.67, y: 0.44 },
          { x: 0.80, y: 0.44 },
          { x: 0.90, y: 0.30 },
          { x: 0.10, y: 0.26 }
        ]
      },
      home: {
        left: [
          { x: 0.20, y: 0.56 },
          { x: 0.33, y: 0.56 },
          { x: 0.46, y: 0.56 },
          { x: 0.90, y: 0.74 },
          { x: 0.10, y: 0.70 }
        ],
        mid: [
          { x: 0.35, y: 0.56 },
          { x: 0.50, y: 0.56 },
          { x: 0.65, y: 0.56 },
          { x: 0.80, y: 0.82 },
          { x: 0.20, y: 0.82 }
        ],
        right: [
          { x: 0.54, y: 0.56 },
          { x: 0.67, y: 0.56 },
          { x: 0.80, y: 0.56 },
          { x: 0.90, y: 0.70 },
          { x: 0.10, y: 0.74 }
        ]
      }
    };

    const staticFormations = {
      away: {
        offense: [
          { x: 0.08, y: 0.26 },
          { x: 0.58, y: 0.42 },
          { x: 0.92, y: 0.26 },
          { x: 0.65, y: 0.12 },
          { x: 0.38, y: 0.26 }
        ]
      },
      home: {
        offense: [
          { x: 0.08, y: 0.74 },
          { x: 0.58, y: 0.58 },
          { x: 0.92, y: 0.74 },
          { x: 0.65, y: 0.88 },
          { x: 0.38, y: 0.74 }
        ]
      }
    };

    const homeReceiveFormations = [
      { '1': { x: 0.64, y: 0.87 }, '2': { x: 0.78, y: 0.72 }, '3': { x: 0.50, y: 0.55 }, '4': { x: 0.22, y: 0.72 }, '5': { x: 0.50, y: 0.74 } },
      { '1': { x: 0.50, y: 0.74 }, '2': { x: 0.68, y: 0.87 }, '3': { x: 0.82, y: 0.55 }, '4': { x: 0.76, y: 0.72 }, '5': { x: 0.22, y: 0.72 } },
      { '1': { x: 0.22, y: 0.72 }, '2': { x: 0.50, y: 0.74 }, '3': { x: 0.68, y: 0.87 }, '4': { x: 0.78, y: 0.72 }, '5': { x: 0.50, y: 0.55 } },
      { '1': { x: 0.76, y: 0.72 }, '2': { x: 0.22, y: 0.72 }, '3': { x: 0.50, y: 0.74 }, '4': { x: 0.68, y: 0.87 }, '5': { x: 0.82, y: 0.55 } },
      { '1': { x: 0.78, y: 0.72 }, '2': { x: 0.22, y: 0.72 }, '3': { x: 0.16, y: 0.55 }, '4': { x: 0.50, y: 0.74 }, '5': { x: 0.68, y: 0.87 } }
    ];

    const awayReceiveFormations = homeReceiveFormations.map(rot => {
      const mirrored = {};
      for (const [pNum, pos] of Object.entries(rot)) {
        mirrored[pNum] = { x: pos.x, y: (1 - pos.y) - 0.03 };
      }
      return mirrored;
    });

    let playersData = [
      { id: 'A4', label: '客4', pNum: '4', team: 'away', slotIndex: 0, isSetter: false },
      { id: 'A3', label: '客3', pNum: '3', team: 'away', slotIndex: 1, isSetter: true },
      { id: 'A2', label: '客2', pNum: '2', team: 'away', slotIndex: 2, isSetter: false },
      { id: 'A5', label: '客5', pNum: '5', team: 'away', slotIndex: 4, isSetter: true },
      { id: 'A1', label: '客1', pNum: '1', team: 'away', slotIndex: 3, isSetter: false },

      { id: 'H4', label: '主4', pNum: '4', team: 'home', slotIndex: 0, isSetter: false },
      { id: 'H3', label: '主3', pNum: '3', team: 'home', slotIndex: 1, isSetter: true },
      { id: 'H2', label: '主2', pNum: '2', team: 'home', slotIndex: 2, isSetter: false },
      { id: 'H5', label: '主5', pNum: '5', team: 'home', slotIndex: 4, isSetter: true },
      { id: 'H1', label: '主1', pNum: '1', team: 'home', slotIndex: 3, isSetter: false }
    ];

    function initCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      redrawAllStrokes();
    }

    function setInteractionMode(mode) {
      currentMode = mode;
      document.getElementById('mode-move').classList.toggle('active', mode === 'move');
      document.getElementById('mode-draw-btn').classList.toggle('active', mode === 'draw');
      document.getElementById('draw-sub-pill').style.display = (mode === 'draw') ? 'flex' : 'none';
      canvas.style.pointerEvents = (mode === 'draw') ? 'auto' : 'none';
    }

    function activateDrawMode() {
      setInteractionMode('draw');
    }

    function setDrawStyle(style) {
      lineStyle = style;
      ['free', 'solid', 'dash'].forEach(s => {
        document.getElementById(`draw-style-${s}`).classList.toggle('active', s === style);
      });
    }

    function getPlayerCoords(p) {
      const stance = teamStances[p.team];
      if (stance === 'defense') {
        const blkSide = teamBlockSide[p.team];
        return defenseFormations[p.team][blkSide][p.slotIndex];
      }
      if (stance === 'receive') {
        const rot = teamRotation[p.team];
        const formationMap = p.team === 'home' ? homeReceiveFormations : awayReceiveFormations;
        return formationMap[rot][p.pNum];
      }
      return staticFormations[p.team][stance][p.slotIndex];
    }

    function renderPlayers() {
      playersLayer.innerHTML = '';
      const rect = container.getBoundingClientRect();

      playersData.forEach(p => {
        const div = document.createElement('div');
        div.className = `player ${p.team}${p.isSetter ? ' setter' : ''}`;
        div.id = p.id;
        div.innerText = p.label;

        const coords = getPlayerCoords(p);
        div.style.left = `${coords.x * rect.width}px`;
        div.style.top = `${coords.y * rect.height}px`;

        makeDraggable(div, 22);
        playersLayer.appendChild(div);
      });
    }

    function updateTeamPositions(team) {
      const rect = container.getBoundingClientRect();
      playersData.filter(p => p.team === team).forEach(p => {
        const el = document.getElementById(p.id);
        const coords = getPlayerCoords(p);
        el.style.left = `${coords.x * rect.width}px`;
        el.style.top = `${coords.y * rect.height}px`;
      });
    }

    function setTeamStance(team, stance) {
      teamStances[team] = stance;

      document.getElementById(`${team}-btn-receive`).classList.toggle('active', stance === 'receive');
      document.getElementById(`${team}-btn-offense`).classList.toggle('active', stance === 'offense');
      document.getElementById(`${team}-btn-defense`).classList.toggle('active', stance === 'defense');

      const blkWrap = document.getElementById(`${team}-blk-wrap`);
      blkWrap.style.display = (stance === 'defense') ? 'flex' : 'none';

      updateTeamPositions(team);
    }

    function setBlockSide(team, side) {
      teamBlockSide[team] = side;

      ['left', 'mid', 'right'].forEach(s => {
        document.getElementById(`${team}-blk-${s}`).classList.toggle('active', s === side);
      });

      updateTeamPositions(team);
    }

    function rotateTeam(team) {
      teamRotation[team] = (teamRotation[team] + 1) % 5;
      playersData.filter(p => p.team === team).forEach(p => {
        p.slotIndex = (p.slotIndex + 1) % 5;
      });
      updateTeamPositions(team);
    }

    function resetPositions() {
      const rect = container.getBoundingClientRect();
      teamStances = { away: 'defense', home: 'receive' };
      teamBlockSide = { away: 'mid', home: 'mid' };
      teamRotation = { away: 0, home: 0 };

      // Away Defense UI
      document.getElementById('away-btn-receive').classList.remove('active');
      document.getElementById('away-btn-offense').classList.remove('active');
      document.getElementById('away-btn-defense').classList.add('active');
      document.getElementById('away-blk-wrap').style.display = 'flex';
      ['left', 'mid', 'right'].forEach(s => {
        document.getElementById(`away-blk-${s}`).classList.toggle('active', s === 'mid');
      });

      // Home Receive UI
      document.getElementById('home-btn-receive').classList.add('active');
      document.getElementById('home-btn-offense').classList.remove('active');
      document.getElementById('home-btn-defense').classList.remove('active');
      document.getElementById('home-blk-wrap').style.display = 'none';

      playersData = [
        { id: 'A4', label: '客4', pNum: '4', team: 'away', slotIndex: 0, isSetter: false },
        { id: 'A3', label: '客3', pNum: '3', team: 'away', slotIndex: 1, isSetter: true },
        { id: 'A2', label: '客2', pNum: '2', team: 'away', slotIndex: 2, isSetter: false },
        { id: 'A5', label: '客5', pNum: '5', team: 'away', slotIndex: 4, isSetter: true },
        { id: 'A1', label: '客1', pNum: '1', team: 'away', slotIndex: 3, isSetter: false },
        { id: 'H4', label: '主4', pNum: '4', team: 'home', slotIndex: 0, isSetter: false },
        { id: 'H3', label: '主3', pNum: '3', team: 'home', slotIndex: 1, isSetter: true },
        { id: 'H2', label: '主2', pNum: '2', team: 'home', slotIndex: 2, isSetter: false },
        { id: 'H5', label: '主5', pNum: '5', team: 'home', slotIndex: 4, isSetter: true },
        { id: 'H1', label: '主1', pNum: '1', team: 'home', slotIndex: 3, isSetter: false }
      ];
      renderPlayers();

      // Ball at server's hand (Away #1)
      ball.style.left = `${rect.width * 0.80}px`;
      ball.style.top = `${rect.height * 0.10}px`;
    }

    function makeDraggable(el, radius = 22) {
      let activeTouchId = null;

      el.addEventListener('pointerdown', (e) => {
        if (currentMode !== 'move') return;
        activeTouchId = e.pointerId;
        el.setPointerCapture(activeTouchId);
        el.classList.add('dragging');
      });

      el.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activeTouchId) return;
        const rect = container.getBoundingClientRect();
        let x = Math.max(radius, Math.min(rect.width - radius, e.clientX - rect.left));
        let y = Math.max(radius, Math.min(rect.height - radius, e.clientY - rect.top));
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
      });

      function onEnd(e) {
        if (e.pointerId === activeTouchId) {
          activeTouchId = null;
          el.classList.remove('dragging');
        }
      }

      el.addEventListener('pointerup', onEnd);
      el.addEventListener('pointercancel', onEnd);
    }

    function startDraw(e) {
      if (currentMode !== 'draw') return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      currentStroke = [{
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      }];
    }

    function draw(e) {
      if (!isDrawing || currentMode !== 'draw') return;
      const rect = canvas.getBoundingClientRect();
      const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      currentStroke.push(pt);

      redrawAllStrokes();
      renderSingleStroke({
        points: currentStroke,
        color: getStrokeColor(lineStyle),
        style: lineStyle
      });
    }

    function stopDraw() {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentStroke.length > 1) {
        strokes.push({
          points: currentStroke,
          color: getStrokeColor(lineStyle),
          style: lineStyle
        });
      }
      currentStroke = [];
      redrawAllStrokes();
    }

    function drawArrowHead(from, to, color) {
      const headlen = 11;
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - headlen * Math.cos(angle - Math.PI / 6), to.y - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - headlen * Math.cos(angle + Math.PI / 6), to.y - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function renderSingleStroke(stroke) {
      const pts = stroke.points;
      if (pts.length < 2) return;

      ctx.save();
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash(stroke.style === 'dash' ? [8, 6] : []);

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();
      ctx.restore();

      if (stroke.style !== 'free') {
        const last = pts[pts.length - 1];
        const prev = pts[Math.max(0, pts.length - 4)];
        drawArrowHead(prev, last, stroke.color);
      }
    }

    function redrawAllStrokes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes.forEach(s => renderSingleStroke(s));
    }

    function undoLine() {
      strokes.pop();
      redrawAllStrokes();
    }

    function clearCanvas() {
      strokes = [];
      redrawAllStrokes();
    }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointercancel', stopDraw);

    window.addEventListener('load', () => {
      initCanvas();
      resetPositions();
      makeDraggable(ball, 17);
      setInteractionMode('move');
    });

    window.addEventListener('resize', () => {
      initCanvas();
    });
  </script>
</body>
</html>
