<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>排球战术板 Pro</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      padding-left: 8px;
      padding-right: 8px;
    }

    #toolbar-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 400px;
      z-index: 100;
    }

    .toolbar-row {
      display: flex;
      gap: 5px;
      justify-content: space-between;
      align-items: center;
    }

    button {
      flex: 1;
      padding: 8px 3px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    button.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
    }

    /* Court Board */
    #board-container {
      position: relative;
      width: min(92vw, 360px);
      height: min(184vw, 680px, 72vh);
      background-color: #d4a373;
      border: 4px solid #ffffff;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      margin: auto 0;
    }

    .court-line {
      position: absolute;
      background: #ffffff;
      pointer-events: none;
    }

    #net {
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: #020617;
      transform: translateY(-50%);
      z-index: 2;
    }

    #net::before, #net::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: #cbd5e1;
      border-radius: 50%;
      top: -3px;
    }
    #net::before { left: -3px; }
    #net::after { right: -3px; }

    .attack-line-top {
      top: 33.33%;
      left: 0;
      width: 100%;
      height: 2px;
    }

    .attack-line-bottom {
      top: 66.66%;
      left: 0;
      width: 100%;
      height: 2px;
    }

    /* Corner Stance & Block Toggles */
    .corner-control {
      position: absolute;
      left: 4px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      z-index: 20;
    }

    #corner-away {
      top: 4px;
    }

    #corner-home {
      bottom: 4px;
    }

    .side-toggle, .block-toggle {
      display: flex;
      flex-direction: row;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      backdrop-filter: blur(4px);
    }

    .side-toggle button, .block-toggle button {
      padding: 4px 6px;
      font-size: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 4px;
    }

    .side-toggle button.active, .block-toggle button.active {
      color: #ffffff;
    }

    #toggle-away button.active, #block-away button.active {
      background: #dc2626;
    }

    #toggle-home button.active, #block-home button.active {
      background: #2563eb;
    }

    #draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* Players */
    .player {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
      border: 2.5px solid #ffffff;
      z-index: 10;
      transform: translate(-50%, -50%);
      letter-spacing: -0.5px;
      transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1), left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .player::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
    }

    .player.dragging {
      transition: none;
    }

    .away { background: #dc2626; }
    .home { background: #2563eb; }

    .away.setter { 
      background: #f87171; 
      color: #ffffff;
    }
    .home.setter { 
      background: #60a5fa; 
      color: #ffffff;
    }

    .player:active {
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* Volleyball */
    #volleyball {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: conic-gradient(
        #ffffff 0deg 60deg, 
        #facc15 60deg 120deg, 
        #2563eb 120deg 180deg, 
        #ffffff 180deg 240deg, 
        #facc15 240deg 300deg, 
        #2563eb 300deg 360deg
      );
      border: 2.5px solid #0f172a;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.65);
      z-index: 15;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      transition: top 0.35s ease, left 0.35s ease;
    }

    #volleyball.dragging {
      transition: none;
    }

    #volleyball::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
    }

    #volleyball:active {
      transform: translate(-50%, -50%) scale(1.2);
    }
  </style>
</head>
<body>

  <div id="toolbar-container">
    <div class="toolbar-row">
      <button id="mode-move" class="active" onclick="setInteractionMode('move')">✋ 移动</button>
      <button id="mode-draw-free" onclick="setInteractionMode('draw', 'free')">✏️ 自由画</button>
      <button id="mode-draw-solid" onclick="setInteractionMode('draw', 'solid')">➔ 实线跑动</button>
      <button id="mode-draw-dash" onclick="setInteractionMode('draw', 'dash')">⇢ 虚线传球</button>
    </div>

    <div class="toolbar-row">
      <button onclick="rotateTeam('home')">🔄 我方轮转</button>
      <button onclick="rotateTeam('away')">🔄 对方轮转</button>
      <button onclick="undoLine()">↩️ 撤销</button>
      <button onclick="clearCanvas()">🧹 清屏</button>
      <button onclick="resetPositions()">重置</button>
    </div>
  </div>

  <div id="board-container">
    <div id="net" class="court-line"></div>
    <div class="attack-line-top court-line"></div>
    <div class="attack-line-bottom court-line"></div>

    <!-- Away Controls (Top Left Corner) -->
    <div id="corner-away" class="corner-control">
      <div id="toggle-away" class="side-toggle">
        <button id="away-btn-defense" class="active" onclick="setTeamStance('away', 'defense')">防</button>
        <button id="away-btn-offense" onclick="setTeamStance('away', 'offense')">攻</button>
        <button id="away-btn-receive" onclick="setTeamStance('away', 'receive')">接</button>
      </div>
      <div id="block-away" class="block-toggle">
        <button id="away-blk-left" onclick="setBlockSide('away', 'left')">左</button>
        <button id="away-blk-mid" class="active" onclick="setBlockSide('away', 'mid')">中</button>
        <button id="away-blk-right" onclick="setBlockSide('away', 'right')">右</button>
      </div>
    </div>

    <!-- Home Controls (Bottom Left Corner) -->
    <div id="corner-home" class="corner-control">
      <div id="toggle-home" class="side-toggle">
        <button id="home-btn-defense" class="active" onclick="setTeamStance('home', 'defense')">防</button>
        <button id="home-btn-offense" onclick="setTeamStance('home', 'offense')">攻</button>
        <button id="home-btn-receive" onclick="setTeamStance('home', 'receive')">接</button>
      </div>
      <div id="block-home" class="block-toggle">
        <button id="home-blk-left" onclick="setBlockSide('home', 'left')">左</button>
        <button id="home-blk-mid" class="active" onclick="setBlockSide('home', 'mid')">中</button>
        <button id="home-blk-right" onclick="setBlockSide('home', 'right')">右</button>
      </div>
    </div>

    <canvas id="draw-layer"></canvas>
    <div id="volleyball"></div>
    <div id="players-layer"></div>
  </div>

  <script>
    const container = document.getElementById('board-container');
    const canvas = document.getElementById('draw-layer');
    const ctx = canvas.getContext('2d');
    const playersLayer = document.getElementById('players-layer');
    const ball = document.getElementById('volleyball');

    let currentMode = 'move';
    let lineStyle = 'free';
    let isDrawing = false;
    let strokes = [];
    let currentStroke = [];

    let teamStances = {
      away: 'defense',
      home: 'defense'
    };

    let teamBlockSide = {
      away: 'mid',
      home: 'mid'
    };

    let teamRotation = {
      away: 0,
      home: 0
    };

    function getStrokeColor(style) {
      if (style === 'dash') return '#ffffff';
      if (style === 'free') return '#000000';
      return '#ef4444';
    }

    const defenseFormations = {
      away: {
        left: [
          { x: 0.26, y: 0.44 },
          { x: 0.38, y: 0.44 },
          { x: 0.51, y: 0.44 },
          { x: 0.83, y: 0.32 },
          { x: 0.16, y: 0.40 }
        ],
        mid: [
          { x: 0.35, y: 0.44 },
          { x: 0.50, y: 0.44 },
          { x: 0.65, y: 0.44 },
          { x: 0.82, y: 0.32 },
          { x: 0.20, y: 0.32 }
        ],
        right: [
          { x: 0.56, y: 0.44 },
          { x: 0.66, y: 0.44 },
          { x: 0.77, y: 0.44 },
          { x: 0.83, y: 0.33 },
          { x: 0.28, y: 0.45 }
        ]
      },
      home: {
        left: [
          { x: 0.26, y: 0.56 },
          { x: 0.38, y: 0.56 },
          { x: 0.51, y: 0.56 },
          { x: 0.83, y: 0.68 },
          { x: 0.16, y: 0.60 }
        ],
        mid: [
          { x: 0.35, y: 0.56 },
          { x: 0.50, y: 0.56 },
          { x: 0.65, y: 0.56 },
          { x: 0.82, y: 0.68 },
          { x: 0.20, y: 0.68 }
        ],
        right: [
          { x: 0.56, y: 0.56 },
          { x: 0.66, y: 0.56 },
          { x: 0.77, y: 0.56 },
          { x: 0.83, y: 0.67 },
          { x: 0.28, y: 0.55 }
        ]
      }
    };

    const staticFormations = {
      away: {
        offense: [
          { x: 0.08, y: 0.26 },
          { x: 0.58, y: 0.42 },
          { x: 0.92, y: 0.26 },
          { x: 0.65, y: 0.12 },
          { x: 0.38, y: 0.26 }
        ]
      },
      home: {
        offense: [
          { x: 0.08, y: 0.74 },
          { x: 0.58, y: 0.58 },
          { x: 0.92, y: 0.74 },
          { x: 0.65, y: 0.88 },
          { x: 0.38, y: 0.74 }
        ]
      }
    };

    const homeReceiveFormations = [
      { '1': { x: 0.64, y: 0.87 }, '2': { x: 0.78, y: 0.72 }, '3': { x: 0.50, y: 0.55 }, '4': { x: 0.22, y: 0.72 }, '5': { x: 0.50, y: 0.74 } },
      { '1': { x: 0.50, y: 0.74 }, '2': { x: 0.68, y: 0.87 }, '3': { x: 0.82, y: 0.55 }, '4': { x: 0.76, y: 0.72 }, '5': { x: 0.22, y: 0.72 } },
      { '1': { x: 0.22, y: 0.72 }, '2': { x: 0.50, y: 0.74 }, '3': { x: 0.68, y: 0.87 }, '4': { x: 0.78, y: 0.72 }, '5': { x: 0.50, y: 0.55 } },
      { '1': { x: 0.76, y: 0.72 }, '2': { x: 0.22, y: 0.72 }, '3': { x: 0.50, y: 0.74 }, '4': { x: 0.68, y: 0.87 }, '5': { x: 0.82, y: 0.55 } },
      { '1': { x: 0.78, y: 0.72 }, '2': { x: 0.22, y: 0.72 }, '3': { x: 0.16, y: 0.55 }, '4': { x: 0.50, y: 0.74 }, '5': { x: 0.68, y: 0.87 } }
    ];

    const awayReceiveFormations = homeReceiveFormations.map(rot => {
      const mirrored = {};
      for (const [pNum, pos] of Object.entries(rot)) {
        mirrored[pNum] = { x: pos.x, y: (1 - pos.y) - 0.03 };
      }
      return mirrored;
    });

    let playersData = [
      { id: 'A4', label: '客4', pNum: '4', team: 'away', slotIndex: 0, isSetter: false },
      { id: 'A3', label: '客3', pNum: '3', team: 'away', slotIndex: 1, isSetter: true },
      { id: 'A2', label: '客2', pNum: '2', team: 'away', slotIndex: 2, isSetter: false },
      { id: 'A5', label: '客5', pNum: '5', team: 'away', slotIndex: 4, isSetter: true },
      { id: 'A1', label: '客1', pNum: '1', team: 'away', slotIndex: 3, isSetter: false },

      { id: 'H4', label: '主4', pNum: '4', team: 'home', slotIndex: 0, isSetter: false },
      { id: 'H3', label: '主3', pNum: '3', team: 'home', slotIndex: 1, isSetter: true },
      { id: 'H2', label: '主2', pNum: '2', team: 'home', slotIndex: 2, isSetter: false },
      { id: 'H5', label: '主5', pNum: '5', team: 'home', slotIndex: 4, isSetter: true },
      { id: 'H1', label: '主1', pNum: '1', team: 'home', slotIndex: 3, isSetter: false }
    ];

    function initCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      redrawAllStrokes();
    }

    function setInteractionMode(mode, style) {
      currentMode = mode;
      if (style) lineStyle = style;

      document.getElementById('mode-move').classList.toggle('active', mode === 'move');
      document.getElementById('mode-draw-free').classList.toggle('active', mode === 'draw' && lineStyle === 'free');
      document.getElementById('mode-draw-solid').classList.toggle('active', mode === 'draw' && lineStyle === 'solid');
      document.getElementById('mode-draw-dash').classList.toggle('active', mode === 'draw' && lineStyle === 'dash');
      canvas.style.pointerEvents = (mode === 'draw') ? 'auto' : 'none';
    }

    function getPlayerCoords(p) {
      const stance = teamStances[p.team];
      if (stance === 'defense') {
        const blkSide = teamBlockSide[p.team];
        return defenseFormations[p.team][blkSide][p.slotIndex];
      }
      if (stance === 'receive') {
        const rot = teamRotation[p.team];
        const formationMap = p.team === 'home' ? homeReceiveFormations : awayReceiveFormations;
        return formationMap[rot][p.pNum];
      }
      return staticFormations[p.team][stance][p.slotIndex];
    }

    function renderPlayers() {
      playersLayer.innerHTML = '';
      const rect = container.getBoundingClientRect();

      playersData.forEach(p => {
        const div = document.createElement('div');
        div.className = `player ${p.team}${p.isSetter ? ' setter' : ''}`;
        div.id = p.id;
        div.innerText = p.label;

        const coords = getPlayerCoords(p);
        div.style.left = `${coords.x * rect.width}px`;
        div.style.top = `${coords.y * rect.height}px`;

        makeDraggable(div, 23);
        playersLayer.appendChild(div);
      });
    }

    function updateTeamPositions(team) {
      const rect = container.getBoundingClientRect();
      playersData.filter(p => p.team === team).forEach(p => {
        const el = document.getElementById(p.id);
        const coords = getPlayerCoords(p);
        el.style.left = `${coords.x * rect.width}px`;
        el.style.top = `${coords.y * rect.height}px`;
      });
    }

    function setTeamStance(team, stance) {
      teamStances[team] = stance;

      document.getElementById(`${team}-btn-defense`).classList.toggle('active', stance === 'defense');
      document.getElementById(`${team}-btn-offense`).classList.toggle('active', stance === 'offense');
      document.getElementById(`${team}-btn-receive`).classList.toggle('active', stance === 'receive');

      const blkToggle = document.getElementById(`block-${team}`);
      blkToggle.style.display = (stance === 'defense') ? 'flex' : 'none';

      updateTeamPositions(team);
    }

    function setBlockSide(team, side) {
      teamBlockSide[team] = side;

      ['left', 'mid', 'right'].forEach(s => {
        document.getElementById(`${team}-blk-${s}`).classList.toggle('active', s === side);
      });

      updateTeamPositions(team);
    }

    function rotateTeam(team) {
      teamRotation[team] = (teamRotation[team] + 1) % 5;
      playersData.filter(p => p.team === team).forEach(p => {
        p.slotIndex = (p.slotIndex + 1) % 5;
      });
      updateTeamPositions(team);
    }

    function resetPositions() {
      const rect = container.getBoundingClientRect();
      teamStances = { away: 'defense', home: 'defense' };
      teamBlockSide = { away: 'mid', home: 'mid' };
      teamRotation = { away: 0, home: 0 };

      ['away', 'home'].forEach(t => {
        document.getElementById(`${t}-btn-defense`).classList.add('active');
        document.getElementById(`${t}-btn-offense`).classList.remove('active');
        document.getElementById(`${t}-btn-receive`).classList.remove('active');

        document.getElementById(`block-${t}`).style.display = 'flex';
        ['left', 'mid', 'right'].forEach(s => {
          document.getElementById(`${t}-blk-${s}`).classList.toggle('active', s === 'mid');
        });
      });

      playersData = [
        { id: 'A4', label: '客4', pNum: '4', team: 'away', slotIndex: 0, isSetter: false },
        { id: 'A3', label: '客3', pNum: '3', team: 'away', slotIndex: 1, isSetter: true },
        { id: 'A2', label: '客2', pNum: '2', team: 'away', slotIndex: 2, isSetter: false },
        { id: 'A5', label: '客5', pNum: '5', team: 'away', slotIndex: 4, isSetter: true },
        { id: 'A1', label: '客1', pNum: '1', team: 'away', slotIndex: 3, isSetter: false },
        { id: 'H4', label: '主4', pNum: '4', team: 'home', slotIndex: 0, isSetter: false },
        { id: 'H3', label: '主3', pNum: '3', team: 'home', slotIndex: 1, isSetter: true },
        { id: 'H2', label: '主2', pNum: '2', team: 'home', slotIndex: 2, isSetter: false },
        { id: 'H5', label: '主5', pNum: '5', team: 'home', slotIndex: 4, isSetter: true },
        { id: 'H1', label: '主1', pNum: '1', team: 'home', slotIndex: 3, isSetter: false }
      ];
      renderPlayers();

      ball.style.left = `${rect.width * 0.8}px`;
      ball.style.top = `${rect.height * 0.94}px`;
    }

    function makeDraggable(el, radius = 23) {
      let activeTouchId = null;

      el.addEventListener('pointerdown', (e) => {
        if (currentMode !== 'move') return;
        activeTouchId = e.pointerId;
        el.setPointerCapture(activeTouchId);
        el.classList.add('dragging');
      });

      el.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activeTouchId) return;
        const rect = container.getBoundingClientRect();
        let x = Math.max(radius, Math.min(rect.width - radius, e.clientX - rect.left));
        let y = Math.max(radius, Math.min(rect.height - radius, e.clientY - rect.top));
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
      });

      function onEnd(e) {
        if (e.pointerId === activeTouchId) {
          activeTouchId = null;
          el.classList.remove('dragging');
        }
      }

      el.addEventListener('pointerup', onEnd);
      el.addEventListener('pointercancel', onEnd);
    }

    function startDraw(e) {
      if (currentMode !== 'draw') return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      currentStroke = [{
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      }];
    }

    function draw(e) {
      if (!isDrawing || currentMode !== 'draw') return;
      const rect = canvas.getBoundingClientRect();
      const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      currentStroke.push(pt);

      redrawAllStrokes();
      renderSingleStroke({
        points: currentStroke,
        color: getStrokeColor(lineStyle),
        style: lineStyle
      });
    }

    function stopDraw() {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentStroke.length > 1) {
        strokes.push({
          points: currentStroke,
          color: getStrokeColor(lineStyle),
          style: lineStyle
        });
      }
      currentStroke = [];
      redrawAllStrokes();
    }

    function drawArrowHead(from, to, color) {
      const headlen = 11;
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - headlen * Math.cos(angle - Math.PI / 6), to.y - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - headlen * Math.cos(angle + Math.PI / 6), to.y - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function renderSingleStroke(stroke) {
      const pts = stroke.points;
      if (pts.length < 2) return;

      ctx.save();
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash(stroke.style === 'dash' ? [8, 6] : []);

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();
      ctx.restore();

      if (stroke.style !== 'free') {
        const last = pts[pts.length - 1];
        const prev = pts[Math.max(0, pts.length - 4)];
        drawArrowHead(prev, last, stroke.color);
      }
    }

    function redrawAllStrokes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes.forEach(s => renderSingleStroke(s));
    }

    function undoLine() {
      strokes.pop();
      redrawAllStrokes();
    }

    function clearCanvas() {
      strokes = [];
      redrawAllStrokes();
    }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointercancel', stopDraw);

    window.addEventListener('load', () => {
      initCanvas();
      resetPositions();
      makeDraggable(ball, 18);
      setInteractionMode('move');
    });

    window.addEventListener('resize', () => {
      initCanvas();
    });
  </script>
</body>
</html>
