<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>排球战术板 Pro</title>
  <style>
    :root {
      --court-w: 360px;
      --court-h: 720px;
      --scale: 1;
      --player-size: calc(44px * var(--scale));
      --ball-size: calc(34px * var(--scale));
      --btn-h: calc(36px * var(--scale));
      --font-main: calc(13px * var(--scale));
      --font-hud: calc(11px * var(--scale));
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Master layout stage: Always locks toolbar and court to identical width */
    #app-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(8px * var(--scale));
      width: var(--court-w);
      height: auto;
      max-height: 100%;
    }

    /* Top Toolbar: Bound 100% to court width */
    #top-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: calc(6px * var(--scale));
      z-index: 100;
    }

    .toolbar-row-primary {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .tool-group {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 4px;
      background: #1e293b;
      padding: calc(3px * var(--scale));
      border-radius: calc(8px * var(--scale));
      border: 1px solid #334155;
    }

    .tool-group > button {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      height: var(--btn-h);
      font-size: var(--font-main);
      font-weight: 700;
      border-radius: calc(6px * var(--scale));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .tool-group > button.active {
      background: #2563eb;
      color: #ffffff;
    }

    .draw-sub-pill {
      display: flex;
      gap: 3px;
      padding-left: calc(4px * var(--scale));
      border-left: 1px solid #475569;
    }

    .draw-sub-pill button {
      border: none;
      background: transparent;
      color: #94a3b8;
      height: calc(var(--btn-h) - 6px);
      padding: 0 calc(8px * var(--scale));
      font-size: calc(var(--font-main) - 1px);
      font-weight: 700;
      border-radius: calc(5px * var(--scale));
      cursor: pointer;
      white-space: nowrap;
    }

    .draw-sub-pill button.active {
      background: #3b82f6;
      color: #ffffff;
    }

    .toolbar-row-secondary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: calc(6px * var(--scale));
    }

    .icon-btn {
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      width: calc(var(--btn-h) * 1.2);
      height: var(--btn-h);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: calc(7px * var(--scale));
      font-size: calc(var(--font-main) + 2px);
      font-weight: 800;
      cursor: pointer;
    }

    .icon-btn:active, .text-action-btn:active {
      background: #334155;
    }

    .text-action-btn {
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-weight: 700;
      font-size: var(--font-main);
      padding: 0 calc(14px * var(--scale));
      height: var(--btn-h);
      border-radius: calc(7px * var(--scale));
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Reset Button */
    .reset-btn-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--btn-h) * 2.1);
      height: var(--btn-h);
    }

    .reset-ring-svg {
      position: absolute;
      top: -2px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      pointer-events: none;
      z-index: 2;
    }

    .reset-ring-path {
      fill: none;
      stroke: #f87171;
      stroke-width: 2.5;
      stroke-linecap: round;
      pathLength: 100;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: drop-shadow(0 0 3px rgba(248, 113, 113, 0.7));
      transition: stroke-dashoffset 0s linear;
    }

    .reset-btn-wrapper.charging .reset-ring-path {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1.4s linear;
    }

    .reset-btn {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      font-weight: 700;
      font-size: var(--font-main);
      border-radius: calc(7px * var(--scale));
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .reset-btn-wrapper.charging .reset-btn {
      background: rgba(239, 68, 68, 0.28);
      transform: scale(0.96);
    }

    /* Court Board (Dynamic Width & Exact 1:2 Aspect Ratio) */
    #board-container {
      position: relative;
      width: var(--court-w);
      height: var(--court-h);
      background-color: #d4a373;
      border: calc(3.5px * var(--scale)) solid #ffffff;
      border-radius: calc(8px * var(--scale));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      flex-shrink: 0;
    }

    .court-line {
      position: absolute;
      background: #ffffff;
      pointer-events: none;
    }

    #net {
      top: 50%;
      left: 0;
      width: 100%;
      height: calc(4px * var(--scale));
      background: #020617;
      transform: translateY(-50%);
      z-index: 2;
    }

    #net::before, #net::after {
      content: '';
      position: absolute;
      width: calc(10px * var(--scale));
      height: calc(10px * var(--scale));
      background: #cbd5e1;
      border-radius: 50%;
      top: calc(-3px * var(--scale));
    }
    #net::before { left: calc(-3px * var(--scale)); }
    #net::after { right: calc(-3px * var(--scale)); }

    .attack-line-top {
      top: 33.333%;
      left: 0;
      width: 100%;
      height: calc(2.2px * var(--scale));
    }

    .attack-line-bottom {
      top: 66.666%;
      left: 0;
      width: 100%;
      height: calc(2.2px * var(--scale));
    }

    /* On-court Tactical Pills: Scaled & Inset */
    .on-court-strip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #475569;
      padding: calc(3px * var(--scale));
      border-radius: calc(6px * var(--scale));
      z-index: 30;
      backdrop-filter: blur(4px);
    }

    .on-court-strip button {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: calc(4px * var(--scale)) calc(7px * var(--scale));
      font-size: var(--font-hud);
      font-weight: 700;
      border-radius: calc(4px * var(--scale));
      cursor: pointer;
    }

    .on-court-strip button.active {
      color: #ffffff;
    }

    #away-stance-pill button.active {
      background: #dc2626;
    }

    #home-stance-pill button.active {
      background: #2563eb;
    }

    .blk-subgroup {
      display: flex;
      gap: 2px;
      padding-left: 3px;
      border-left: 1px solid #475569;
    }

    .on-court-rotate {
      position: absolute;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.88);
      color: #f1f5f9;
      padding: calc(4px * var(--scale)) calc(8px * var(--scale));
      font-size: var(--font-hud);
      font-weight: 700;
      border-radius: calc(6px * var(--scale));
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      z-index: 30;
      backdrop-filter: blur(4px);
    }

    .on-court-rotate:active {
      background: #334155;
    }

    #away-stance-pill { top: calc(6px * var(--scale)); left: calc(6px * var(--scale)); }
    #away-rotate-btn { top: calc(6px * var(--scale)); right: calc(6px * var(--scale)); }
    #home-stance-pill { bottom: calc(6px * var(--scale)); left: calc(6px * var(--scale)); }
    #home-rotate-btn { bottom: calc(6px * var(--scale)); right: calc(6px * var(--scale)); }

    #draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    /* Player Nodes */
    .player {
      position: absolute;
      width: var(--player-size);
      height: var(--player-size);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: var(--font-main);
      color: #ffffff;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.55);
      border: calc(2.2px * var(--scale)) solid #ffffff;
      z-index: 10;
      transform: translate(-50%, -50%);
      letter-spacing: -0.5px;
      transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1), left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .player::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
    }

    .player.dragging {
      transition: none;
    }

    .away { background: #dc2626; }
    .home { background: #2563eb; }

    .away.setter { background: #f87171; }
    .home.setter { background: #60a5fa; }

    .player:active {
      transform: translate(-50%, -50%) scale(1.12);
    }

    /* Volleyball */
    #volleyball {
      position: absolute;
      width: var(--ball-size);
      height: var(--ball-size);
      border-radius: 50%;
      background: conic-gradient(
        #ffffff 0deg 60deg, 
        #facc15 60deg 120deg, 
        #2563eb 120deg 180deg, 
        #ffffff 180deg 240deg, 
        #facc15 240deg 300deg, 
        #2563eb 300deg 360deg
      );
      border: calc(2px * var(--scale)) solid #0f172a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.65);
      z-index: 15;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      transition: top 0.35s ease, left 0.35s ease;
    }

    #volleyball.dragging {
      transition: none;
    }

    #volleyball::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
    }

    #volleyball:active {
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* iPad/Desktop Landscape optimization: side-by-side docking */
    @media (orientation: landscape) and (min-height: 480px) {
      #app-stage {
        flex-direction: row;
        width: auto;
        gap: 16px;
      }
      #top-bar {
        width: 170px;
      }
      .toolbar-row-primary, .toolbar-row-secondary {
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .tool-group {
        flex-direction: column;
        width: 100%;
      }
      .tool-group > button {
        width: 100%;
      }
      .draw-sub-pill {
        border-left: none;
        border-top: 1px solid #475569;
        padding-left: 0;
        padding-top: 4px;
        width: 100%;
        justify-content: center;
      }
      .action-left {
        width: 100%;
        justify-content: space-between;
      }
      .reset-btn-wrapper {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="app-stage">
    <!-- Top Toolbar -->
    <div id="top-bar">
      <div class="toolbar-row-primary">
        <div class="tool-group">
          <button id="mode-move" class="active" onclick="setInteractionMode('move')">✋ 移动</button>
          <button id="mode-draw-btn" onclick="activateDrawMode()">✏️ 画笔</button>
          <div id="draw-sub-pill" class="draw-sub-pill" style="display: none;">
            <button id="draw-style-free" class="active" onclick="setDrawStyle('free')">自由</button>
            <button id="draw-style-solid" onclick="setDrawStyle('solid')">实线</button>
            <button id="draw-style-dash" onclick="setDrawStyle('dash')">虚线</button>
          </div>
        </div>
      </div>

      <div class="toolbar-row-secondary">
        <div class="action-left">
          <button class="icon-btn" onclick="undoLine()" title="撤销">↩</button>
          <button class="text-action-btn" onclick="clearCanvas()">清屏</button>
        </div>

        <div id="reset-wrapper" class="reset-btn-wrapper">
          <svg class="reset-ring-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <rect class="reset-ring-path" x="3" y="3" width="94" height="94" rx="14" ry="14" />
          </svg>
          <button id="reset-btn" class="reset-btn" title="轻触：还原当前战术站位并清屏 | 长按：重置整场">重置</button>
        </div>
      </div>
    </div>

    <!-- Court Board -->
    <div id="board-container">
      <div id="net" class="court-line"></div>
      <div class="attack-line-top court-line"></div>
      <div class="attack-line-bottom court-line"></div>

      <!-- Away Tactical Strip -->
      <div id="away-stance-pill" class="on-court-strip">
        <button id="away-btn-receive" onclick="setTeamStance('away', 'receive')">接</button>
        <button id="away-btn-offense" onclick="setTeamStance('away', 'offense')">攻</button>
        <button id="away-btn-defense" class="active" onclick="setTeamStance('away', 'defense')">防</button>
        <div id="away-blk-wrap" class="blk-subgroup">
          <button id="away-blk-left" onclick="setBlockSide('away', 'left')">左</button>
          <button id="away-blk-mid" class="active" onclick="setBlockSide('away', 'mid')">中</button>
          <button id="away-blk-right" onclick="setBlockSide('away', 'right')">右</button>
        </div>
      </div>
      <button id="away-rotate-btn" class="on-court-rotate" onclick="rotateTeam('away')">🔄 轮转</button>

      <!-- Home Tactical Strip -->
      <div id="home-stance-pill" class="on-court-strip">
        <button id="home-btn-receive" class="active" onclick="setTeamStance('home', 'receive')">接</button>
        <button id="home-btn-offense" onclick="setTeamStance('home', 'offense')">攻</button>
        <button id="home-btn-defense" onclick="setTeamStance('home', 'defense')">防</button>
        <div id="home-blk-wrap" class="blk-subgroup" style="display: none;">
          <button id="home-blk-left" onclick="setBlockSide('home', 'left')">左</button>
          <button id="home-blk-mid" class="active" onclick="setBlockSide('home', 'mid')">中</button>
          <button id="home-blk-right" onclick="setBlockSide('home', 'right')">右</button>
        </div>
      </div>
      <button id="home-rotate-btn" class="on-court-rotate" onclick="rotateTeam('home')">🔄 轮转</button>

      <canvas id="draw-layer"></canvas>
      <div id="volleyball"></div>
      <div id="players-layer"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('board-container');
    const canvas = document.getElementById('draw-layer');
    const ctx = canvas.getContext('2d');
    const playersLayer = document.getElementById('players-layer');
    const ball = document.getElementById('volleyball');
    const resetWrapper = document.getElementById('reset-wrapper');
    const resetBtn = document.getElementById('reset-btn');

    let currentMode = 'move';
    let lineStyle = 'free';
    let isDrawing = false;
    let strokes = [];
    let currentStroke = [];

    let teamStances = { away: 'defense', home: 'receive' };
    let teamBlockSide = { away: 'mid', home: 'mid' };
    let teamRotation = { away: 0, home: 0 };

    function getStrokeColor(style) {
      if (style === 'dash') return '#ffffff';
      if (style === 'free') return '#000000';
      return '#ef4444';
    }

    /* Auto-Geometry Sizing Engine: Calculates exact 1:2 aspect ratio fit */
    function recalculateLayout() {
      const isLandscape = window.innerWidth > window.innerHeight && window.innerHeight >= 480;
      const padX = 24;
      const padY = 24;
      const availW = window.innerWidth - padX;
      const availH = window.innerHeight - padY;

      let courtW, courtH;

      if (isLandscape) {
        // Landscape: Toolbar is placed side-by-side (170px + 16px gap)
        const maxH = availH;
        const maxW = availW - 186;
        if (maxW * 2 <= maxH) {
          courtW = maxW;
          courtH = maxW * 2;
        } else {
          courtH = maxH;
          courtW = maxH / 2;
        }
      } else {
        // Portrait (iPhone / iPad Portrait): Toolbar is stacked on top
        const estimatedTopBarH = 88;
        const maxH = availH - estimatedTopBarH;
        const maxW = Math.min(availW, 640); // Cap on large tablet portrait

        if (maxW * 2 <= maxH) {
          courtW = maxW;
          courtH = maxW * 2;
        } else {
          courtH = maxH;
          courtW = maxH / 2;
        }
      }

      courtW = Math.floor(courtW);
      courtH = Math.floor(courtH);

      // Baseline scale 1.0 is calibrated to mobile 360px width
      const scale = Math.max(0.85, Math.min(1.8, courtW / 360));

      document.documentElement.style.setProperty('--court-w', `${courtW}px`);
      document.documentElement.style.setProperty('--court-h', `${courtH}px`);
      document.documentElement.style.setProperty('--scale', scale.toFixed(3));

      initCanvas();
      updateTeamPositions('away');
      updateTeamPositions('home');
      setBallStaticPosition();
    }

    const defenseFormations = {
      away: {
        left: [
          { x: 0.20, y: 0.44 }, { x: 0.33, y: 0.44 }, { x: 0.46, y: 0.44 },
          { x: 0.88, y: 0.25 }, { x: 0.12, y: 0.28 }
        ],
        mid: [
          { x: 0.35, y: 0.44 }, { x: 0.50, y: 0.44 }, { x: 0.65, y: 0.44 },
          { x: 0.80, y: 0.18 }, { x: 0.20, y: 0.18 }
        ],
        right: [
          { x: 0.54, y: 0.44 }, { x: 0.67, y: 0.44 }, { x: 0.80, y: 0.44 },
          { x: 0.88, y: 0.28 }, { x: 0.12, y: 0.25 }
        ]
      },
      home: {
        left: [
          { x: 0.20, y: 0.56 }, { x: 0.33, y: 0.56 }, { x: 0.46, y: 0.56 },
          { x: 0.88, y: 0.75 }, { x: 0.12, y: 0.72 }
        ],
        mid: [
          { x: 0.35, y: 0.56 }, { x: 0.50, y: 0.56 }, { x: 0.65, y: 0.56 },
          { x: 0.80, y: 0.82 }, { x: 0.20, y: 0.82 }
        ],
        right: [
          { x: 0.54, y: 0.56 }, { x: 0.67, y: 0.56 }, { x: 0.80, y: 0.56 },
          { x: 0.88, y: 0.72 }, { x: 0.12, y: 0.75 }
        ]
      }
    };

    const staticFormations = {
      away: {
        offense: [
          { x: 0.12, y: 0.25 }, { x: 0.58, y: 0.42 }, { x: 0.88, y: 0.25 },
          { x: 0.65, y: 0.12 }, { x: 0.38, y: 0.25 }
        ]
      },
      home: {
        offense: [
          { x: 0.12, y: 0.75 }, { x: 0.58, y: 0.58 }, { x: 0.88, y: 0.75 },
          { x: 0.65, y: 0.88 }, { x: 0.38, y: 0.75 }
        ]
      }
    };

    const homeReceiveFormations = [
      { '1': { x: 0.64, y: 0.86 }, '2': { x: 0.78, y: 0.72 }, '3': { x: 0.50, y: 0.55 }, '4': { x: 0.22, y: 0.72 }, '5': { x: 0.50, y: 0.74 } },
      { '1': { x: 0.50, y: 0.74 }, '2': { x: 0.68, y: 0.86 }, '3': { x: 0.82, y: 0.55 }, '4': { x: 0.76, y: 0.72 }, '5': { x: 0.22, y: 0.72 } },
      { '1': { x: 0.22, y: 0.72 }, '2': { x: 0.50, y: 0.74 }, '3': { x: 0.68, y: 0.86 }, '4': { x: 0.78, y: 0.72 }, '5': { x: 0.50, y: 0.55 } },
      { '1': { x: 0.76, y: 0.72 }, '2': { x: 0.22, y: 0.72 }, '3': { x: 0.50, y: 0.74 }, '4': { x: 0.68, y: 0.86 }, '5': { x: 0.82, y: 0.55 } },
      { '1': { x: 0.78, y: 0.72 }, '2': { x: 0.22, y: 0.72 }, '3': { x: 0.16, y: 0.55 }, '4': { x: 0.50, y: 0.74 }, '5': { x: 0.68, y: 0.86 } }
    ];

    const awayReceiveFormations = homeReceiveFormations.map(rot => {
      const mirrored = {};
      for (const [pNum, pos] of Object.entries(rot)) {
        mirrored[pNum] = { x: pos.x, y: (1 - pos.y) - 0.03 };
      }
      return mirrored;
    });

    let playersData = [
      { id: 'A4', label: '客4', pNum: '4', team: 'away', slotIndex: 0, isSetter: false },
      { id: 'A3', label: '客3', pNum: '3', team: 'away', slotIndex: 1, isSetter: true },
      { id: 'A2', label: '客2', pNum: '2', team: 'away', slotIndex: 2, isSetter: false },
      { id: 'A5', label: '客5', pNum: '5', team: 'away', slotIndex: 4, isSetter: true },
      { id: 'A1', label: '客1', pNum: '1', team: 'away', slotIndex: 3, isSetter: false },

      { id: 'H4', label: '主4', pNum: '4', team: 'home', slotIndex: 0, isSetter: false },
      { id: 'H3', label: '主3', pNum: '3', team: 'home', slotIndex: 1, isSetter: true },
      { id: 'H2', label: '主2', pNum: '2', team: 'home', slotIndex: 2, isSetter: false },
      { id: 'H5', label: '主5', pNum: '5', team: 'home', slotIndex: 4, isSetter: true },
      { id: 'H1', label: '主1', pNum: '1', team: 'home', slotIndex: 3, isSetter: false }
    ];

    function initCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      redrawAllStrokes();
    }

    function setInteractionMode(mode) {
      currentMode = mode;
      document.getElementById('mode-move').classList.toggle('active', mode === 'move');
      document.getElementById('mode-draw-btn').classList.toggle('active', mode === 'draw');
      document.getElementById('draw-sub-pill').style.display = (mode === 'draw') ? 'flex' : 'none';
      canvas.style.pointerEvents = (mode === 'draw') ? 'auto' : 'none';
    }

    function activateDrawMode() {
      setInteractionMode('draw');
    }

    function setDrawStyle(style) {
      lineStyle = style;
      ['free', 'solid', 'dash'].forEach(s => {
        document.getElementById(`draw-style-${s}`).classList.toggle('active', s === style);
      });
    }

    function getPlayerCoords(p) {
      const stance = teamStances[p.team];
      if (stance === 'defense') {
        const blkSide = teamBlockSide[p.team];
        return defenseFormations[p.team][blkSide][p.slotIndex];
      }
      if (stance === 'receive') {
        const rot = teamRotation[p.team];
        const formationMap = p.team === 'home' ? homeReceiveFormations : awayReceiveFormations;
        return formationMap[rot][p.pNum];
      }
      return staticFormations[p.team][stance][p.slotIndex];
    }

    function renderPlayers() {
      playersLayer.innerHTML = '';
      const rect = container.getBoundingClientRect();

      playersData.forEach(p => {
        const div = document.createElement('div');
        div.className = `player ${p.team}${p.isSetter ? ' setter' : ''}`;
        div.id = p.id;
        div.innerText = p.label;

        const coords = getPlayerCoords(p);
        div.style.left = `${coords.x * rect.width}px`;
        div.style.top = `${coords.y * rect.height}px`;

        makeDraggable(div);
        playersLayer.appendChild(div);
      });
    }

    /* Fixed Ball Positioning: Bottom Right safe zone */
    function setBallStaticPosition() {
      const rect = container.getBoundingClientRect();
      ball.style.left = `${rect.width * 0.82}px`;
      ball.style.top = `${rect.height * 0.90}px`;
    }

    function updateTeamPositions(team) {
      const rect = container.getBoundingClientRect();
      playersData.filter(p => p.team === team).forEach(p => {
        const el = document.getElementById(p.id);
        if (el) {
          const coords = getPlayerCoords(p);
          el.style.left = `${coords.x * rect.width}px`;
          el.style.top = `${coords.y * rect.height}px`;
        }
      });
    }

    function setTeamStance(team, stance) {
      teamStances[team] = stance;
      document.getElementById(`${team}-btn-receive`).classList.toggle('active', stance === 'receive');
      document.getElementById(`${team}-btn-offense`).classList.toggle('active', stance === 'offense');
      document.getElementById(`${team}-btn-defense`).classList.toggle('active', stance === 'defense');

      const blkWrap = document.getElementById(`${team}-blk-wrap`);
      blkWrap.style.display = (stance === 'defense') ? 'flex' : 'none';
      updateTeamPositions(team);
    }

    function setBlockSide(team, side) {
      teamBlockSide[team] = side;
      ['left', 'mid', 'right'].forEach(s => {
        document.getElementById(`${team}-blk-${s}`).classList.toggle('active', s === side);
      });
      updateTeamPositions(team);
    }

    function rotateTeam(team) {
      teamRotation[team] = (teamRotation[team] + 1) % 5;
      playersData.filter(p => p.team === team).forEach(p => {
        p.slotIndex = (p.slotIndex + 1) % 5;
      });
      updateTeamPositions(team);
    }

    function resetToCurrentFormation() {
      updateTeamPositions('away');
      updateTeamPositions('home');
      setBallStaticPosition();
      clearCanvas();
    }

    function fullMatchReset() {
      teamStances = { away: 'defense', home: 'receive' };
      teamBlockSide = { away: 'mid', home: 'mid' };
      teamRotation = { away: 0, home: 0 };

      document.getElementById('away-btn-receive').classList.remove('active');
      document.getElementById('away-btn-offense').classList.remove('active');
      document.getElementById('away-btn-defense').classList.add('active');
      document.getElementById('away-blk-wrap').style.display = 'flex';
      ['left', 'mid', 'right'].forEach(s => {
        document.getElementById(`away-blk-${s}`).classList.toggle('active', s === 'mid');
      });

      document.getElementById('home-btn-receive').classList.add('active');
      document.getElementById('home-btn-offense').classList.remove('active');
      document.getElementById('home-btn-defense').classList.remove('active');
      document.getElementById('home-blk-wrap').style.display = 'none';

      playersData = [
        { id: 'A4', label: '客4', pNum: '4', team: 'away', slotIndex: 0, isSetter: false },
        { id: 'A3', label: '客3', pNum: '3', team: 'away', slotIndex: 1, isSetter: true },
        { id: 'A2', label: '客2', pNum: '2', team: 'away', slotIndex: 2, isSetter: false },
        { id: 'A5', label: '客5', pNum: '5', team: 'away', slotIndex: 4, isSetter: true },
        { id: 'A1', label: '客1', pNum: '1', team: 'away', slotIndex: 3, isSetter: false },
        { id: 'H4', label: '主4', pNum: '4', team: 'home', slotIndex: 0, isSetter: false },
        { id: 'H3', label: '主3', pNum: '3', team: 'home', slotIndex: 1, isSetter: true },
        { id: 'H2', label: '主2', pNum: '2', team: 'home', slotIndex: 2, isSetter: false },
        { id: 'H5', label: '主5', pNum: '5', team: 'home', slotIndex: 4, isSetter: true },
        { id: 'H1', label: '主1', pNum: '1', team: 'home', slotIndex: 3, isSetter: false }
      ];
      renderPlayers();
      clearCanvas();
      setBallStaticPosition();
    }

    let resetTimer = null;
    let didLongPress = false;

    function cancelResetCharge() {
      clearTimeout(resetTimer);
      resetWrapper.classList.remove('charging');
    }

    resetBtn.addEventListener('pointerdown', () => {
      didLongPress = false;
      resetWrapper.classList.add('charging');
      resetTimer = setTimeout(() => {
        didLongPress = true;
        resetWrapper.classList.remove('charging');
        fullMatchReset();
        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      }, 1400);
    });

    resetBtn.addEventListener('pointerup', () => {
      cancelResetCharge();
      if (!didLongPress) {
        resetToCurrentFormation();
        if (navigator.vibrate) navigator.vibrate(25);
      }
    });

    resetBtn.addEventListener('pointercancel', cancelResetCharge);
    resetBtn.addEventListener('pointerleave', cancelResetCharge);

    function makeDraggable(el) {
      let activeTouchId = null;

      el.addEventListener('pointerdown', (e) => {
        if (currentMode !== 'move') return;
        activeTouchId = e.pointerId;
        el.setPointerCapture(activeTouchId);
        el.classList.add('dragging');
      });

      el.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activeTouchId) return;
        const rect = container.getBoundingClientRect();
        const halfWidth = el.offsetWidth / 2;
        const halfHeight = el.offsetHeight / 2;
        let x = Math.max(halfWidth, Math.min(rect.width - halfWidth, e.clientX - rect.left));
        let y = Math.max(halfHeight, Math.min(rect.height - halfHeight, e.clientY - rect.top));
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
      });

      function onEnd(e) {
        if (e.pointerId === activeTouchId) {
          activeTouchId = null;
          el.classList.remove('dragging');
        }
      }

      el.addEventListener('pointerup', onEnd);
      el.addEventListener('pointercancel', onEnd);
    }

    function startDraw(e) {
      if (currentMode !== 'draw') return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      currentStroke = [{
        rx: (e.clientX - rect.left) / rect.width,
        ry: (e.clientY - rect.top) / rect.height
      }];
    }

    function draw(e) {
      if (!isDrawing || currentMode !== 'draw') return;
      const rect = canvas.getBoundingClientRect();
      const pt = { 
        rx: (e.clientX - rect.left) / rect.width, 
        ry: (e.clientY - rect.top) / rect.height 
      };
      currentStroke.push(pt);
      redrawAllStrokes();
      renderSingleStroke({
        points: currentStroke,
        color: getStrokeColor(lineStyle),
        style: lineStyle
      });
    }

    function stopDraw() {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentStroke.length > 1) {
        strokes.push({
          points: currentStroke,
          color: getStrokeColor(lineStyle),
          style: lineStyle
        });
      }
      currentStroke = [];
      redrawAllStrokes();
    }

    function drawArrowHead(from, to, color, w, h) {
      const headlen = Math.max(10, w * 0.03);
      const dx = (to.rx - from.rx) * w;
      const dy = (to.ry - from.ry) * h;
      const angle = Math.atan2(dy, dx);
      const targetX = to.rx * w;
      const targetY = to.ry * h;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(targetX, targetY);
      ctx.lineTo(targetX - headlen * Math.cos(angle - Math.PI / 6), targetY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(targetX - headlen * Math.cos(angle + Math.PI / 6), targetY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function renderSingleStroke(stroke) {
      const pts = stroke.points;
      if (pts.length < 2) return;
      const w = container.clientWidth;
      const h = container.clientHeight;

      ctx.save();
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth = Math.max(3.5, w * 0.009);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash(stroke.style === 'dash' ? [8, 6] : []);

      ctx.beginPath();
      ctx.moveTo(pts[0].rx * w, pts[0].ry * h);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].rx * w, pts[i].ry * h);
      }
      ctx.stroke();
      ctx.restore();

      if (stroke.style !== 'free') {
        const last = pts[pts.length - 1];
        const prev = pts[Math.max(0, pts.length - 4)];
        drawArrowHead(prev, last, stroke.color, w, h);
      }
    }

    function redrawAllStrokes() {
      ctx.clearRect(0, 0, container.clientWidth, container.clientHeight);
      strokes.forEach(s => renderSingleStroke(s));
    }

    function undoLine() {
      strokes.pop();
      redrawAllStrokes();
    }

    function clearCanvas() {
      strokes = [];
      redrawAllStrokes();
    }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointercancel', stopDraw);

    window.addEventListener('load', () => {
      recalculateLayout();
      fullMatchReset();
      makeDraggable(ball);
      setInteractionMode('move');
    });

    window.addEventListener('resize', recalculateLayout);
    window.addEventListener('orientationchange', recalculateLayout);
  </script>
</body>
</html>
